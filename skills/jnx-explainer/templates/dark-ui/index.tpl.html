<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Mono"; src: url("assets/fonts/DejaVuSansMono.ttf"); font-weight: 400; }
      @font-face { font-family: "TC"; src: url("assets/fonts/TCMed.ttf"); font-weight: 500; }
      @font-face { font-family: "TC"; src: url("assets/fonts/TCBold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e0e10; }
      #root { position: relative; width: 100%; height: 100%; background: #0e0e10; }
      #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ln { fill: none; stroke: #34343a; stroke-width: 3; }
      .gl { fill: none; stroke: #4ade80; stroke-width: 4; }
      .mono { font-family: "Mono", "TC", monospace; dominant-baseline: central; }
      .pt { font-family: "Poppins", "TC", sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .ptl { font-family: "Poppins", "TC", sans-serif; font-weight: 700; text-anchor: start; dominant-baseline: central; }
      .ico { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <svg id="scene" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.45" />
          </filter>
          <linearGradient id="redG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff405b" /><stop offset="1" stop-color="#e20d32" /></linearGradient>
          <clipPath id="ccp"><circle id="cc" cx="800" cy="330" r="0" /></clipPath>
          <mask id="irisM" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900"><rect x="0" y="0" width="1600" height="900" fill="#fff" /><circle id="hole" cx="800" cy="330" r="0" fill="#000" /></mask>
          <clipPath id="wmClip"><rect id="wmR" x="450" y="500" width="0" height="200" /></clipPath>
          <image id="wmImg" width="700" height="__WMH__" href="__WM__" />
        </defs>
        <g id="world"></g>
        <g id="trn" mask="url(#irisM)"><rect x="0" y="0" width="1600" height="900" fill="url(#redG)" clip-path="url(#ccp)" /></g>
      </svg>
      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="__TOTAL__" data-track-index="1" data-volume="1"></audio>
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="__TOTAL__" data-track-index="2" data-volume="0.22"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="__TOTAL__" data-track-index="3" data-volume="0.75"></audio>
    </div>

    <script>
      var TOTAL = __TOTAL__;
      var SC = __SC__;
      var NS = "http://www.w3.org/2000/svg";
      var C = { card: "#19191c", edge: "#2c2c31", track: "#2a2a30", text: "#e8e6e3", dim: "#9a9aa3",
                orange: "#e0775b", green: "#4ade80", red: "#f4606c", blue: "#5b9cf5", yellow: "#f5d94a", amber: "#f5a623", grey: "#4a4a52" };
      var tl = gsap.timeline({ paused: true });
      window.SFX = [];
      function sfx(k, t, d) { window.SFX.push({ k: k, t: t, d: d || 0 }); }

      var IC = {
        check: '<path d="M20 6 9 17l-5-5"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        list: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
        flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
        box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/>',
        rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
        branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        undo: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
        warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'
      };
      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        (parent || document.getElementById("world")).appendChild(e);
        return e;
      }
      function grp(id, parent) { return el("g", { id: id }, parent); }
      function txt(id, x, y, s, cls, fill, size, parent, anchor) {
        var t = el("text", { id: id, class: cls, x: x, y: y, fill: fill, "font-size": size }, parent);
        if (anchor) t.setAttribute("text-anchor", anchor);
        t.textContent = s; return t;
      }
      function icon(parent, name, x, y, sc, color, sw, cls) {
        var g = el("g", { class: "ico " + (cls || ""), transform: "translate(" + x + " " + y + ") scale(" + sc + ")", "stroke-width": sw }, parent);
        g.innerHTML = IC[name]; gsap.set(g, { stroke: color }); return g;
      }
      /* round status badge: ring + base icon + overlay icons */
      function badge(id, cx, cy, base, color, parent) {
        var g = grp(id, parent);
        var ring = el("circle", { class: "ring", cx: cx, cy: cy, r: 24, fill: C.card, "stroke-width": 3.5 }, g);
        gsap.set(ring, { stroke: color });
        icon(g, base, cx - 13, cy - 13, 1.08, color, 2.4, "base");
        return g;
      }
      function overlay(g, cx, cy, name, color, cls) { var i = icon(g, name, cx - 13, cy - 13, 1.08, color, 2.6, cls); gsap.set(i, { opacity: 0 }); return i; }
      function mascot(id, cx, cy, parent) {
        var g = grp(id, parent);
        el("circle", { cx: cx, cy: cy, r: 62, fill: "none", stroke: C.edge, "stroke-width": 2.5 }, g);
        var orb = el("g", {}, g); el("circle", { cx: cx + 62, cy: cy, r: 6, fill: C.orange }, orb);
        var m = el("g", { transform: "translate(" + (cx - 27) + " " + (cy - 24) + ")" }, g), s = 5;
        function px(x, y, w, h, f) { el("rect", { x: x * s, y: y * s, width: w * s, height: h * s, fill: f }, m); }
        px(2, 0, 1, 1, C.orange); px(8, 0, 1, 1, C.orange); px(0, 1, 11, 7, C.orange);
        px(3, 3, 1, 2, "#1a1210"); px(7, 3, 1, 2, "#1a1210"); px(4, 6, 3, 1, "#1a1210"); px(2, 8, 2, 1, C.orange); px(7, 8, 2, 1, C.orange);
        tl.to(orb, { rotation: 360 * (TOTAL / 3.2), svgOrigin: cx + " " + cy, ease: "none", duration: TOTAL }, 0);
        return g;
      }
      function pill(id, cx, cy, w, text, fill, color, size, parent) {
        var g = grp(id, parent);
        el("rect", { x: cx - w / 2, y: cy - 22, width: w, height: 44, rx: 22, fill: fill, stroke: color, "stroke-width": 2 }, g);
        txt(id + "T", cx, cy + 1, text, "mono", color, size || 19, g, "middle");
        return g;
      }
      function counter(id, x, y, label, parent) {
        var g = grp(id, parent);
        txt(id + "L", x, y, label, "mono", C.dim, 22, g);
        var v = txt(id + "V", x + 24 + label.length * 13.2, y, "0", "mono", C.text, 30, g); v.setAttribute("font-weight", "bold");
        return { g: g, v: v };
      }

      /* ---------- motion vocabulary (each helper also logs its sound) ---------- */
      var V = {
        pop: function (s, at, quiet) { tl.fromTo(s, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, at); if (!quiet) sfx("pop", at); },
        fade: function (s, at) { tl.fromTo(s, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at); sfx("pop", at); },
        draw: function (s, at, dur) { tl.to(s, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at); sfx("draw", at, dur); },
        stroke: function (s, to, at, kind) { tl.to(s, { stroke: to, duration: 0.25, ease: "power1.inOut" }, at); if (kind) sfx(kind, at); },
        fillc: function (s, to, at) { tl.to(s, { fill: to, duration: 0.25, ease: "power1.inOut" }, at); },
        show: function (s, at) { tl.set(s, { opacity: 1 }, at); },
        hide: function (s, at) { tl.set(s, { opacity: 0 }, at); },
        shake: function (s, at) { tl.to(s, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at); tl.set(s, { x: 0 }, at + 0.32); sfx("warn", at); },
        /* progress bar: scaleX 0 -> to, color blue while running, then final color */
        bar: function (s, at, dur, to, run, done) {
          tl.set(s, { fill: run }, at);
          tl.to(s, { scaleX: to, duration: dur, ease: "power1.inOut" }, at);
          if (done) tl.to(s, { fill: done, duration: 0.2 }, at + dur);
          sfx("fill", at, dur);
        },
        resetBar: function (s, at) { tl.to(s, { scaleX: 0, duration: 0.2, ease: "power2.in" }, at); },
        /* icon swap inside a badge: base out, overlay in, ring + icon recolor */
        flip: function (id, over, color, at, kind) {
          V.stroke("#" + id + " .ring", color, at, kind);
          tl.to("#" + id + " .base", { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " ." + over, { opacity: 1, stroke: color, duration: 0.2 }, at + 0.05);
        },
        unflip: function (id, over, at) {   /* back to the base icon */
          tl.to("#" + id + " ." + over, { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " .base", { opacity: 1, duration: 0.15 }, at + 0.05);
        },
        swapText: function (a, b, at) { tl.to(a, { opacity: 0, duration: 0.15 }, at); tl.to(b, { opacity: 1, duration: 0.2 }, at + 0.05); },
        along: function (s, pathSel, at, dur, rev) {
          var p = document.querySelector(pathSel), L = p.getTotalLength(), e = document.querySelector(s), o = { u: 0 };
          tl.to(o, { u: 1, duration: dur, ease: "power2.inOut", onUpdate: function () {
            var pt = p.getPointAtLength((rev ? 1 - o.u : o.u) * L);
            e.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ")");
          } }, at);
          sfx("travel", at, dur);
        },
        type: function (sel, text, at, per) {
          var e = document.querySelector(sel), o = { n: 0 };
          tl.to(o, { n: text.length, duration: text.length * per, ease: "none", onUpdate: function () { e.textContent = text.slice(0, Math.round(o.n)); } }, at);
          for (var i = 0; i < text.length; i++) sfx("key", at + i * per);
        },
        count: function (c, from, to, at, dur) {
          var o = { n: from }, n = Math.abs(to - from);
          tl.to(o, { n: to, duration: dur, ease: "none", onUpdate: function () { c.v.textContent = Math.round(o.n); } }, at);
          for (var i = 1; i <= n; i++) sfx("tick", at + dur * i / n);
        }
      };
      function prep(sel) { var e = document.querySelector(sel), L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + " " + (L + 40), strokeDashoffset: L + 8 }); }
      function line(id, d, cls, parent) { return el("path", { id: id, class: cls || "ln", d: d }, parent); }

      Object.assign(IC, {
        filetext: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
        thumb: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
        archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>'
      });
      var BLUEBG = "#1b2231", DARK = "#202024";
      function hid(l) { l.forEach(function (s) { if (document.querySelector(s)) gsap.set(s, { opacity: 0 }); }); }
      function windowFrame(id, x, y, w, h, parent) {
        var g = grp(id, parent);
        el("rect", { class: "face", x: x, y: y, width: w, height: h, rx: 22, fill: C.card, stroke: C.edge, "stroke-width": 3, filter: "url(#sh)" }, g);
        el("path", { d: "M" + x + " " + (y + 56) + " H" + (x + w), stroke: C.edge, "stroke-width": 2 }, g);
        [C.red, C.yellow, C.green].forEach(function (c, i) { el("circle", { cx: x + 32 + i * 20, cy: y + 28, r: 6, fill: c, opacity: 0.85 }, g); });
        return g;
      }
      function card(id, x, y, w, h, parent) {
        var g = grp(id, parent);
        el("rect", { class: "face", x: x, y: y, width: w, height: h, rx: 22, fill: C.card, stroke: C.edge, "stroke-width": 3, filter: "url(#sh)" }, g);
        return g;
      }
      var G = []; for (var gi = 0; gi <= 5; gi++) { G[gi] = grp("g" + gi); gsap.set(G[gi], { opacity: 0 }); }

      /* ===== brand logo helper (from favicon.svg) ===== */
      function logo(id, cx, cy, size, parent) {
        var g = grp(id, parent), s = size / 128;
        var inner = el("g", { transform: "translate(" + (cx - size / 2) + " " + (cy - size / 2) + ") scale(" + s + ")" }, g);
        el("circle", { cx: 64, cy: 64, r: 57, fill: "url(#redG)" }, inner);
        el("circle", { cx: 64, cy: 64, r: 55.5, fill: "none", stroke: "#fff", "stroke-opacity": 0.92, "stroke-width": 2 }, inner);
        var orb = el("g", { class: "orb", fill: "none", stroke: "#fff", "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" }, inner);
        [-32, 32, 90].forEach(function (r) { el("ellipse", { class: "oe", cx: 64, cy: 64, rx: 33, ry: 13, transform: "rotate(" + r + " 64 64)" }, orb); });
        el("circle", { class: "od", cx: 64, cy: 64, r: 7, fill: "#fff", stroke: "none" }, orb);
        el("circle", { class: "od", cx: 91, cy: 48, r: 4, fill: "#fff", stroke: "none" }, orb);
        el("circle", { cx: 105, cy: 24, r: 4, fill: "#fff" }, inner);
        return g;
      }

      /* ===== Claude-style spinner: 12 rounded dashes, a bright head chasing a fading tail ===== */
      var SPL = [36, 30, 34, 28, 36, 31, 34, 29, 36, 30, 33, 28];
      function claudeSpin(id, cx, cy, sc, parent, start, dur) {
        var g = grp(id, parent), inner = el("g", { transform: "translate(" + cx + " " + cy + ") scale(" + sc + ")" }, g), ls = [];
        for (var i = 0; i < 12; i++) {
          ls.push(el("line", { x1: 0, y1: -20, x2: 0, y2: -SPL[i], stroke: C.orange, "stroke-width": 5.5, "stroke-linecap": "round", transform: "rotate(" + (i * 30) + ")", opacity: 0.3 }, inner));
        }
        var o = { a: 0 };
        function draw() {
          for (var i = 0; i < 12; i++) {
            var d = (((o.a - i) % 12) + 12) % 12;
            ls[i].setAttribute("opacity", (0.16 + 0.84 * Math.pow(1 - d / 12, 1.6)).toFixed(3));
          }
        }
        draw();
        if (dur > 0) tl.to(o, { a: dur * 12, duration: dur, ease: "none", onUpdate: draw }, start);
        return g;
      }

      /* ===== S0 : brand intro (jnxstudio) ===== */
      logo("lg0", 800, 330, 230, G[0]);
      var wm0 = grp("wm0", G[0]); el("use", { href: "#wmImg", x: 450, y: 530 }, wm0); wm0.setAttribute("clip-path", "url(#wmClip)");
      hid(["#lg0"]);
      document.querySelectorAll("#lg0 .oe").forEach(function (e) { var L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + " " + (L + 40), strokeDashoffset: L + 8 }); });
      gsap.set("#lg0 .od", { opacity: 0 });

      /* ===== S1 : title ===== */
      txt("t1", 800, 480, "流程走到哪？", "pt", C.text, 116, G[1]);
      var u1 = el("rect", { id: "u1", x: 470, y: 560, width: 660, height: 8, rx: 4, fill: C.orange }, G[1]); gsap.set(u1, { scaleX: 0, transformOrigin: "0% 50%" });
      pill("sub1", 800, 660, 420, "步驟進度條 Stepper", "#2a1a14", C.orange, 30, G[1]);
      hid(["#t1", "#sub1"]);

      /* ===== persistent stepper (S1 end .. S5) ===== */
      var XS = [350, 650, 950, 1250], CY = 190, SN = ["提交申請", "主管審核", "品保確認", "結案"];
      var SP = grp("SP"); gsap.set(SP, { opacity: 0 });
      for (i = 0; i < 3; i++) {
        var tk = line("tk" + i, "M" + (XS[i] + 46) + " " + CY + " H" + (XS[i + 1] - 46), "ln", SP); tk.style.strokeWidth = "6px"; tk.style.strokeLinecap = "round";
      }
      for (i = 0; i < 3; i++) {
        var sg = line("sg" + i, "M" + (XS[i] + 46) + " " + CY + " H" + (XS[i + 1] - 46), "gl", SP); sg.style.strokeWidth = "6px"; sg.style.strokeLinecap = "round"; prep("#sg" + i);
      }
      for (i = 0; i < 4; i++) {
        var cg = grp("cg" + i, SP);
        var gw = el("circle", { id: "gw" + i, cx: XS[i], cy: CY, r: 38, fill: "none", stroke: C.orange, "stroke-width": 4, opacity: 0 }, cg);
        el("circle", { id: "sc" + i, cx: XS[i], cy: CY, r: 38, fill: C.card, stroke: C.grey, "stroke-width": 4.5 }, cg);
        txt("sn" + i, XS[i], CY + 1, String(i + 1), "pt", C.dim, 36, cg);
        var ckg = icon(cg, "check", XS[i] - 20, CY - 20, 1.67, "#0e0e10", 3.2, "ckI"); ckg.setAttribute("id", "ck" + i); gsap.set(ckg, { opacity: 0 });
        txt("sb" + i, XS[i], CY + 82, SN[i], "pt", C.dim, 30, SP);
      }
      hid(["#cg0", "#cg1", "#cg2", "#cg3", "#sb0", "#sb1", "#sb2", "#sb3", "#tk0", "#tk1", "#tk2"]);
      function stepActive(n, at, gd, rep) {
        tl.to("#sc" + n, { stroke: C.orange, duration: 0.2 }, at);
        tl.to("#sn" + n, { fill: C.orange, duration: 0.2 }, at);
        tl.to("#sb" + n, { fill: C.text, duration: 0.2 }, at);
        tl.fromTo("#gw" + n, { attr: { r: 38 }, opacity: 0.7 }, { attr: { r: 62 }, opacity: 0, duration: gd, repeat: rep, ease: "power1.out", immediateRender: false }, at);
        sfx("pop", at);
      }
      function stepDone(n, at) {
        tl.to("#sc" + n, { fill: C.green, stroke: C.green, duration: 0.25 }, at);
        tl.to("#sn" + n, { opacity: 0, duration: 0.12 }, at);
        tl.to("#ck" + n, { opacity: 1, duration: 0.2 }, at + 0.06);
        tl.to("#sb" + n, { fill: C.green, duration: 0.25 }, at);
        tl.to("#cg" + n, { scale: 1.16, svgOrigin: XS[n] + " " + CY, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        sfx("ding", at);
      }
      function stepLine(n, at) { tl.to("#sg" + n, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, at); sfx("draw", at, 0.4); }

      /* ===== panel scaffolding (S2..S5) ===== */
      var pfm = card("pfm", 250, 320, 1100, 470, G[2]); gsap.set(pfm, { opacity: 0 });
      var PN = [], PT = [["send", C.blue, "提交申請", "草稿", "已送出"], ["thumb", C.yellow, "主管審核", "待審核", "已核准"], ["shield", C.orange, "品保確認", "檢查中", "通過"], ["archive", C.green, "結案歸檔", "處理中", "已結案"]];
      PT.forEach(function (p, n) {
        var g = grp("pn" + n, G[2]); PN.push(g); gsap.set(g, { opacity: 0 });
        icon(g, p[0], 290, 336, 1.9, p[1], 1.8); txt("ph" + n, 356, 360, p[2], "ptl", C.text, 38, g);
        el("path", { d: "M250 410 H1350", stroke: C.edge, "stroke-width": 2 }, g);
        pill("pa" + n, 1230, 360, 170, p[3], n == 2 ? BLUEBG : "#222228", n == 2 ? C.blue : C.dim, 26, g);
        pill("pb" + n, 1230, 360, 170, p[4], "#10261a", C.green, 26, g); gsap.set("#pb" + n, { opacity: 0 });
      });
      function swapPanel(a, b, at) {
        tl.to(PN[a], { x: -70, opacity: 0, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(PN[b], { x: 70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, at + 0.15);
        sfx("pop", at + 0.15);
      }
      function pillDone(n, at) { V.swapText("#pa" + n, "#pb" + n, at); }
      /* cursor */
      var cur = grp("cur", G[2]); el("path", { d: "M0 0 L0 30 L8 23 L14 36 L20 33 L14 21 L25 21 Z", fill: "#ffffff", stroke: "#0e0e10", "stroke-width": 2.5, "stroke-linejoin": "round" }, cur);
      gsap.set(cur, { opacity: 0, x: 1000, y: 800 });

      /* P1 : form */
      [["申請人", "王小明", 470], ["項目", "設備維修", 545], ["金額", "NT$ 12,000", 620]].forEach(function (r, k) {
        el("text", { x: 290, y: r[2], class: "ptl", fill: C.dim, "font-size": 28 }, PN[0]).textContent = r[0];
        el("rect", { x: 440, y: r[2] - 30, width: 860, height: 60, rx: 14, fill: DARK, stroke: C.edge, "stroke-width": 2.5 }, PN[0]);
        txt("v1" + k, 468, r[2] + 1, "", "mono", C.text, 30, PN[0]);
      });
      var b1 = grp("btn1", PN[0]);
      el("rect", { id: "b1r", x: 1130, y: 678, width: 170, height: 62, rx: 20, fill: C.orange }, b1);
      txt("b1t", 1215, 710, "送出", "pt", "#1a1210", 30, b1);

      /* P2 : review */
      var sm = grp("sm", PN[1]);
      el("rect", { x: 290, y: 450, width: 540, height: 290, rx: 18, fill: DARK, stroke: C.edge, "stroke-width": 2.5 }, sm);
      icon(sm, "filetext", 322, 478, 2, C.blue, 1.7); txt("smT", 392, 512, "請購單 #0231", "ptl", C.text, 32, sm);
      [440, 360, 400].forEach(function (w, i) { el("rect", { x: 322, y: 568 + i * 36, width: w, height: 12, rx: 6, fill: C.track }, sm); });
      pill("smP", 440, 700, 220, "NT$ 12,000", "#2a2410", C.yellow, 24, sm);
      var rj = grp("rjb", PN[1]);
      el("rect", { x: 900, y: 460, width: 400, height: 84, rx: 24, fill: "none", stroke: C.red, "stroke-width": 3 }, rj);
      txt("rjT", 1100, 503, "退回", "pt", C.red, 36, rj);
      var ap2 = grp("apb", PN[1]);
      el("rect", { id: "apR", x: 900, y: 600, width: 400, height: 84, rx: 24, fill: "#10261a", stroke: C.green, "stroke-width": 3 }, ap2);
      txt("apT2", 1100, 643, "同意", "pt", C.green, 36, ap2);

      /* P3 : AI check */
      claudeSpin("sp3", 322, 454, 0.95, PN[2], 0, 0);
      txt("st3a", 392, 454, "AI 檢查中…", "ptl", C.dim, 34, PN[2]);
      txt("st3b", 392, 454, "檢查完成", "ptl", C.green, 34, PN[2]); gsap.set("#st3b", { opacity: 0 });
      var ck3 = grp("ck3p", PN[2]); icon(ck3, "check", 322 - 24, 454 - 24, 2, C.green, 3.2); gsap.set(ck3, { opacity: 0 });
      ["規格符合", "供應商合格", "預算範圍內"].forEach(function (n, k) {
        var cy = 540 + k * 82, g = grp("rw3" + k, PN[2]);
        el("rect", { x: 290, y: cy - 33, width: 1010, height: 66, rx: 18, fill: DARK, stroke: C.edge, "stroke-width": 2.5 }, g);
        var bg = badge("bd3" + k, 336, cy, "clock", C.grey, g); overlay(bg, 336, cy, "check", C.green, "ok");
        txt("rt3" + k, 396, cy + 1, n, "ptl", C.text, 30, g);
        gsap.set(g, { opacity: 0 });
      });

      /* P4 : closed */
      var cc4 = grp("cc4", PN[3]);
      el("circle", { id: "c4r", cx: 500, cy: 560, r: 92, fill: "#10261a", stroke: C.green, "stroke-width": 6 }, cc4);
      var c4 = icon(cc4, "check", 500 - 54, 560 - 54, 4.5, C.green, 2.6); c4.setAttribute("id", "c4i"); gsap.set(c4, { opacity: 0 });
      txt("c4t", 660, 520, "已結案", "ptl", C.text, 76, PN[3]);
      txt("c4l", 660, 612, "總耗時", "ptl", C.dim, 34, PN[3]);
      txt("c4v", 810, 612, "0", "mono", C.text, 56, PN[3]).setAttribute("font-weight", "bold");
      txt("c4u", 860, 616, "天", "ptl", C.dim, 34, PN[3]);
      SN.forEach(function (n, k) { pill("c4p" + k, 420 + k * 240, 730, 210, n, "#10261a", C.green, 24, PN[3]); gsap.set("#c4p" + k, { opacity: 0 }); });
      hid(["#cc4", "#c4t", "#c4l", "#c4v", "#c4u"]);

      /* ===== S6 : Claude status animation ===== */
      var w6 = windowFrame("w6", 250, 180, 1100, 520, G[3]);
      txt("w6T", 380, 209, "Claude", "ptl", C.dim, 22, w6);
      /* spinner is created here with its real tween (timeline wired below) */
      var STAT = [["s6a", "思考中…"], ["s6b", "正在讀取檔案…"], ["s6c", "正在整理結果…"]];
      claudeSpin("sp6", 500, 450, 2.3, G[3], 0, 0); gsap.set("#sp6", { opacity: 0 });
      STAT.forEach(function (s) { txt(s[0], 660, 450, s[1], "ptl", C.dim, 48, G[3]); gsap.set("#" + s[0], { opacity: 0 }); });
      txt("s6d", 660, 450, "完成", "ptl", C.green, 48, G[3]); gsap.set("#s6d", { opacity: 0 });
      var ck6 = grp("ck6", G[3]); icon(ck6, "check", 500 - 52, 450 - 52, 4.3, C.green, 2.8); gsap.set(ck6, { opacity: 0 });
      pill("p6a", 800, 610, 360, "Claude 處理中", "#2a1a14", C.orange, 28, G[3]);
      pill("p6b", 800, 610, 360, "已完成", "#10261a", C.green, 28, G[3]); gsap.set("#p6b", { opacity: 0 });
      hid(["#w6", "#p6a"]);

      /* ===== S7 : headline ===== */
      var bk = grp("bk", G[4]);
      [-32, 32, 90].forEach(function (r) { el("ellipse", { cx: 800, cy: 450, rx: 330, ry: 128, fill: "none", stroke: "#26262c", "stroke-width": 3, transform: "rotate(" + r + " 800 450)" }, bk); });
      txt("h1", 800, 350, "每一步", "pt", C.text, 130, G[4]); hid(["#h1", "#bk"]);
      var hl = el("rect", { id: "hl", x: 300, y: 440, width: 1000, height: 200, rx: 26, fill: "#e8123a" }, G[4]); gsap.set(hl, { scaleX: 0, transformOrigin: "0% 50%" });
      txt("h2", 800, 543, "都看得見", "pt", "#ffffff", 104, G[4]); hid(["#h2"]);
      pill("wbx", 800, 750, 340, "步驟進度條", BLUEBG, C.blue, 30, G[4]); hid(["#wbx"]);

      /* ===== S8 : brand end card ===== */
      logo("lg10", 800, 340, 200, G[5]);
      var wm10 = grp("wm10", G[5]); el("use", { href: "#wmImg", transform: "translate(500 540) scale(0.857)" }, wm10);
      hid(["#lg10", "#wm10"]);

      /* ================= timeline ================= */
      var T = function (n) { return SC[n - 1]; };
      var t, i, k;
      function spin(sel, to, at, dur, ease) { var e = document.querySelector(sel), o = { a: 0 }; tl.to(o, { a: to, duration: dur, ease: ease, onUpdate: function () { e.setAttribute("transform", "rotate(" + o.a + " 64 64)"); } }, at); }
      function iris(at, cx, cy) {
        tl.set(["#cc", "#hole"], { attr: { cx: cx, cy: cy, r: 0 } }, at - 0.01);
        tl.to("#cc", { attr: { r: 1100 }, duration: 0.5, ease: "power3.in" }, at); sfx("swipe", at);
      }
      function irisOpen(at, cx, cy) {
        tl.set("#hole", { attr: { cx: cx, cy: cy } }, at - 0.01);
        tl.to("#hole", { attr: { r: 1200 }, duration: 0.55, ease: "power2.out" }, at); sfx("ding", at + 0.15);
      }
      /* S0 : brand intro */
      V.show(G[0], 0);
      V.pop("#lg0", 0.1, true); sfx("sting", 0.1);
      document.querySelectorAll("#lg0 .oe").forEach(function (e, n) { tl.to(e, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.45 + n * 0.1); });
      tl.to("#lg0 .od", { opacity: 1, duration: 0.2, stagger: 0.08 }, 0.95);
      spin("#lg0 .orb", 120, 0.5, 1.9, "power2.inOut");
      tl.to("#wmR", { attr: { width: 700 }, duration: 0.6, ease: "power3.out" }, 1.0); sfx("pop", 1.0);
      iris(2.05, 800, 330);
      V.hide(G[0], 2.55); V.show(G[1], 2.55);
      irisOpen(2.55, 800, 450);

      /* S1 : title, then the stepper pops in along the top */
      t = T(1);
      V.pop("#t1", t - 0.12);
      tl.to("#u1", { scaleX: 1, duration: 0.4, ease: "power3.out" }, t + 0.5); sfx("draw", t + 0.5, 0.4);
      V.pop("#sub1", t + 1.0, true); sfx("chime", t + 1.0);
      V.show(SP, t + 1.9);
      for (i = 0; i < 4; i++) {
        V.pop("#cg" + i, t + 2.0 + i * 0.25); V.pop("#sb" + i, t + 2.05 + i * 0.25, true);
        if (i < 3) tl.fromTo("#tk" + i, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t + 2.12 + i * 0.25);
      }

      /* S2 : step 1, fill the form and send */
      t = T(2); V.hide(G[1], t); V.show(G[2], t);
      V.pop("#pfm", t + 0.0, true);
      tl.fromTo("#pn0", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, t + 0.1);
      stepActive(0, t + 0.05, 0.8, 1);
      V.type("#v10", "王小明", t + 0.4, 0.07);
      V.type("#v11", "設備維修", t + 0.75, 0.07);
      V.type("#v12", "NT$ 12,000", t + 1.15, 0.06);
      tl.set("#cur", { opacity: 1 }, t + 1.6);
      tl.to("#cur", { x: 1190, y: 712, duration: 0.5, ease: "power2.inOut" }, t + 1.6);
      tl.to("#btn1", { scale: 0.93, svgOrigin: "1215 709", duration: 0.09, yoyo: true, repeat: 1 }, t + 2.15); sfx("tick", t + 2.15);
      tl.to("#b1r", { fill: C.green, duration: 0.2 }, t + 2.2); tl.set("#b1t", { textContent: "已送出" }, t + 2.2);
      pillDone(0, t + 2.2);
      tl.to("#cur", { opacity: 0, duration: 0.2 }, t + 2.6);
      stepDone(0, t + 2.3); stepLine(0, t + 2.45);

      /* S3 : step 2, manager approves */
      t = T(3); swapPanel(0, 1, t);
      stepActive(1, t + 0.1, 0.8, 1);
      tl.set("#cur", { opacity: 1, x: 1000, y: 800 }, t + 0.8);
      tl.to("#cur", { x: 1250, y: 650, duration: 0.55, ease: "power2.inOut" }, t + 0.8);
      tl.to("#apb", { scale: 0.95, svgOrigin: "1100 642", duration: 0.09, yoyo: true, repeat: 1 }, t + 1.55); sfx("tick", t + 1.55);
      tl.to("#apR", { fill: C.green, duration: 0.2 }, t + 1.6); tl.to("#apT2", { fill: "#0e0e10", duration: 0.2 }, t + 1.6);
      tl.to("#rjb", { opacity: 0.3, duration: 0.2 }, t + 1.6);
      pillDone(1, t + 1.65);
      tl.to("#cur", { opacity: 0, duration: 0.2 }, t + 2.05);
      stepDone(1, t + 1.85); stepLine(1, t + 2.0);

      /* S4 : step 3, AI checks (Claude spinner) */
      t = T(4); swapPanel(1, 2, t);
      stepActive(2, t + 0.1, 0.8, 2);
      for (i = 0; i < 3; i++) V.fade("#rw3" + i, t + 0.5 + i * 0.2);
      /* real spinner tween: spins from t+0.2 until t+2.7 */
      (function () {
        var g = document.getElementById("sp3"), ls = g.querySelectorAll("line"), o = { a: 0 };
        tl.to(o, { a: 2.5 * 12, duration: 2.5, ease: "none", onUpdate: function () {
          for (var q = 0; q < 12; q++) { var d = (((o.a - q) % 12) + 12) % 12; ls[q].setAttribute("opacity", (0.16 + 0.84 * Math.pow(1 - d / 12, 1.6)).toFixed(3)); }
        } }, t + 0.2);
      })();
      V.flip("bd30", "ok", C.green, t + 1.2, "tick"); V.flip("bd31", "ok", C.green, t + 1.75, "tick"); V.flip("bd32", "ok", C.green, t + 2.3, "tick");
      tl.set("#sp3", { opacity: 0 }, t + 2.75);
      tl.fromTo("#ck3p", { opacity: 0, scale: 0.6, svgOrigin: "322 454" }, { opacity: 1, scale: 1, svgOrigin: "322 454", duration: 0.25, ease: "back.out(2)", immediateRender: false }, t + 2.75);
      V.swapText("#st3a", "#st3b", t + 2.75);
      pillDone(2, t + 2.8);
      stepDone(2, t + 3.0); stepLine(2, t + 3.15);

      /* S5 : step 4, closed */
      t = T(5); swapPanel(2, 3, t);
      stepActive(3, t + 0.1, 0.5, 0);
      tl.to("#cc4", { opacity: 1, duration: 0.01 }, t + 0.35);
      tl.fromTo("#c4r", { scale: 0.5, svgOrigin: "500 560", opacity: 0 }, { scale: 1, svgOrigin: "500 560", opacity: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t + 0.35);
      tl.to("#c4i", { opacity: 1, duration: 0.2 }, t + 0.6);
      tl.to(["#c4t", "#c4l", "#c4v", "#c4u"], { opacity: 1, duration: 0.25, stagger: 0.1 }, t + 0.7);
      pillDone(3, t + 0.7);
      (function () { var o = { v: 0 }; tl.to(o, { v: 2, duration: 0.5, ease: "none", onUpdate: function () { document.getElementById("c4v").textContent = Math.round(o.v); } }, t + 1.2); sfx("tick", t + 1.45); sfx("tick", t + 1.7); })();
      stepDone(3, t + 0.75);
      for (i = 0; i < 4; i++) { tl.set("#c4p" + i, { opacity: 1 }, t + 1.9 + i * 0.2); sfx("pop", t + 1.9 + i * 0.2); }
      sfx("chime", t + 2.8);
      tl.to("#tk0, #tk1, #tk2", { stroke: C.green, duration: 0.3 }, t + 2.8);

      /* S6 : Claude spinner */
      t = T(6); V.hide(G[2], t); V.hide(SP, t); V.show(G[3], t);
      V.pop("#w6", t + 0.05);
      V.pop("#sp6", t + 0.3, true); sfx("pop", t + 0.3);
      (function () {
        var g = document.getElementById("sp6"), ls = g.querySelectorAll("line"), o = { a: 0 };
        tl.to(o, { a: 3.0 * 12, duration: 3.0, ease: "none", onUpdate: function () {
          for (var q = 0; q < 12; q++) { var d = (((o.a - q) % 12) + 12) % 12; ls[q].setAttribute("opacity", (0.16 + 0.84 * Math.pow(1 - d / 12, 1.6)).toFixed(3)); }
        } }, t + 0.3);
      })();
      V.pop("#p6a", t + 0.5, true);
      tl.to("#s6a", { opacity: 1, duration: 0.2 }, t + 0.4);
      V.swapText("#s6a", "#s6b", t + 1.4);
      V.swapText("#s6b", "#s6c", t + 2.4);
      tl.set("#sp6", { opacity: 0 }, t + 3.3);
      tl.fromTo("#ck6", { opacity: 0, scale: 0.6, svgOrigin: "500 450" }, { opacity: 1, scale: 1, svgOrigin: "500 450", duration: 0.3, ease: "back.out(2)", immediateRender: false }, t + 3.3);
      V.swapText("#s6c", "#s6d", t + 3.3); V.swapText("#p6a", "#p6b", t + 3.3); sfx("ding", t + 3.3);

      /* S7 : headline, then brand end card */
      t = T(7); V.hide(G[3], t); V.show(G[4], t);
      V.pop("#bk", t + 0.05, true); tl.to("#bk", { rotation: 55, duration: 4.2, ease: "none" }, t);
      V.pop("#h1", t + 0.05);
      tl.to("#hl", { scaleX: 1, duration: 0.35, ease: "power3.out" }, t + 0.25); sfx("draw", t + 0.25, 0.35);
      V.pop("#h2", t + 0.4); V.pop("#wbx", t + 0.9, true); sfx("chime", t + 0.9);
      iris(t + 3.55, 800, 450);
      V.hide(G[4], t + 4.05); V.show(G[5], t + 4.05);
      irisOpen(t + 4.05, 800, 380);
      V.pop("#lg10", t + 4.25, true); sfx("sting", t + 4.25);
      spin("#lg10 .orb", 90, t + 4.25, 2.2, "power1.inOut");
      V.pop("#wm10", t + 4.5, true); sfx("pop", t + 4.5);

      tl.set({}, {}, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
