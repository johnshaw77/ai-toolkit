      var TOTAL = 42.46;
      var SC = [0.0, 2.556, 6.576, 9.924, 13.464, 16.98, 20.712, 24.012, 27.288, 31.092, 35.568, 38.364];
      var NS = "http://www.w3.org/2000/svg";
      var C = { card: "#19191c", edge: "#2c2c31", track: "#2a2a30", text: "#e8e6e3", dim: "#9a9aa3",
                orange: "#e0775b", green: "#4ade80", red: "#f4606c", blue: "#5b9cf5", yellow: "#f5d94a", amber: "#f5a623", grey: "#4a4a52" };

      window.SFX = [];
      function sfx(k, t, d) { window.SFX.push({ k: k, t: t, d: d || 0 }); }

      var IC = {
        check: '<path d="M20 6 9 17l-5-5"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        list: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
        flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
        box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/>',
        rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
        branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        undo: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',

      };
      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        (parent || document.getElementById("world")).appendChild(e);
        return e;
      }
      function grp(id, parent) { return el("g", { id: id }, parent); }
      function txt(id, x, y, s, cls, fill, size, parent, anchor) {
        var t = el("text", { id: id, class: cls, x: x, y: y, fill: fill, "font-size": size }, parent);

      /* round status badge: ring + base icon + overlay icons */

      }
      function overlay(g, cx, cy, name, color, cls) { var i = icon(g, name, cx - 13, cy - 13, 1.08, color, 2.6, cls); gsap.set(i, { opacity: 0 }); return i; }
      function mascot(id, cx, cy, parent) {
        var g = grp(id, parent);
        el("circle", { cx: cx, cy: cy, r: 62, fill: "none", stroke: C.edge, "stroke-width": 2.5 }, g);
        var orb = el("g", {}, g); el("circle", { cx: cx + 62, cy: cy, r: 6, fill: C.orange }, orb);
        var m = el("g", { transform: "translate(" + (cx - 27) + " " + (cy - 24) + ")" }, g), s = 5;
        function px(x, y, w, h, f) { el("rect", { x: x * s, y: y * s, width: w * s, height: h * s, fill: f }, m); }
        px(2, 0, 1, 1, C.orange); px(8, 0, 1, 1, C.orange); px(0, 1, 11, 7, C.orange);
        px(3, 3, 1, 2, "#1a1210"); px(7, 3, 1, 2, "#1a1210"); px(4, 6, 3, 1, "#1a1210"); px(2, 8, 2, 1, C.orange); px(7, 8, 2, 1, C.orange);
        tl.to(orb, { rotation: 360 * (TOTAL / 3.2), svgOrigin: cx + " " + cy, ease: "none", duration: TOTAL }, 0);
        return g;
      }
      function pill(id, cx, cy, w, text, fill, color, size, parent) {
        var g = grp(id, parent);
        el("rect", { x: cx - w / 2, y: cy - 22, width: w, height: 44, rx: 22, fill: fill, stroke: color, "stroke-width": 2 }, g);
        txt(id + "T", cx, cy + 1, text, "mono", color, size || 19, g, "middle");

      }
      function counter(id, x, y, label, parent) {
        var g = grp(id, parent);

        return { g: g, v: v };
      }

      /* ---------- motion vocabulary (each helper also logs its sound) ---------- */
      var V = {
        pop: function (s, at, quiet) { tl.fromTo(s, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, at); if (!quiet) sfx("pop", at); },
        fade: function (s, at) { tl.fromTo(s, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at); sfx("pop", at); },
        draw: function (s, at, dur) { tl.to(s, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at); sfx("draw", at, dur); },
        stroke: function (s, to, at, kind) { tl.to(s, { stroke: to, duration: 0.25, ease: "power1.inOut" }, at); if (kind) sfx(kind, at); },
        fillc: function (s, to, at) { tl.to(s, { fill: to, duration: 0.25, ease: "power1.inOut" }, at); },
        show: function (s, at) { tl.set(s, { opacity: 1 }, at); },
        hide: function (s, at) { tl.set(s, { opacity: 0 }, at); },
        shake: function (s, at) { tl.to(s, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at); tl.set(s, { x: 0 }, at + 0.32); sfx("warn", at); },
        /* progress bar: scaleX 0 -> to, color blue while running, then final color */
        bar: function (s, at, dur, to, run, done) {
          tl.set(s, { fill: run }, at);
          tl.to(s, { scaleX: to, duration: dur, ease: "power1.inOut" }, at);
          if (done) tl.to(s, { fill: done, duration: 0.2 }, at + dur);
          sfx("fill", at, dur);
        },
        resetBar: function (s, at) { tl.to(s, { scaleX: 0, duration: 0.2, ease: "power2.in" }, at); },
        /* icon swap inside a badge: base out, overlay in, ring + icon recolor */
        flip: function (id, over, color, at, kind) {
          V.stroke("#" + id + " .ring", color, at, kind);
          tl.to("#" + id + " .base", { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " ." + over, { opacity: 1, stroke: color, duration: 0.2 }, at + 0.05);
        },
        unflip: function (id, over, at) {   /* back to the base icon */
          tl.to("#" + id + " ." + over, { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " .base", { opacity: 1, duration: 0.15 }, at + 0.05);
        },
        swapText: function (a, b, at) { tl.to(a, { opacity: 0, duration: 0.15 }, at); tl.to(b, { opacity: 1, duration: 0.2 }, at + 0.05); },
        along: function (s, pathSel, at, dur, rev) {
          var p = document.querySelector(pathSel), L = p.getTotalLength(), e = document.querySelector(s), o = { u: 0 };
          tl.to(o, { u: 1, duration: dur, ease: "power2.inOut", onUpdate: function () {
            var pt = p.getPointAtLength((rev ? 1 - o.u : o.u) * L);
            e.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ")");
          } }, at);
          sfx("travel", at, dur);
        },
        type: function (sel, text, at, per) {
          var e = document.querySelector(sel), o = { n: 0 };
          tl.to(o, { n: text.length, duration: text.length * per, ease: "none", onUpdate: function () { e.textContent = text.slice(0, Math.round(o.n)); } }, at);
          for (var i = 0; i < text.length; i++) sfx("key", at + i * per);
        },
        count: function (c, from, to, at, dur) {
          var o = { n: from }, n = Math.abs(to - from);
          tl.to(o, { n: to, duration: dur, ease: "none", onUpdate: function () { c.v.textContent = Math.round(o.n); } }, at);
          for (var i = 1; i <= n; i++) sfx("tick", at + dur * i / n);
        }
      };
      function prep(sel) { var e = document.querySelector(sel), L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + " " + (L + 40), strokeDashoffset: L + 8 }); }
      function line(id, d, cls, parent) { return el("path", { id: id, class: cls || "ln", d: d }, parent); }

      /* ================= groups ================= */
      var g1 = grp("g1"), gp = grp("gp"), g12 = grp("g12");
      [g1, gp, g12].forEach(function (g) { gsap.set(g, { opacity: 0 }); });

      /* ---- g1 : S1 push ---- */
      mascot("m1", 150, 450, g1);
      var term = grp("term", g1);
      el("rect", { x: 300, y: 330, width: 560, height: 240, rx: 18, fill: C.card, stroke: C.edge, "stroke-width": 2, filter: "url(#sh)" }, term);
      [C.red, C.yellow, C.green].forEach(function (c, i) { el("circle", { cx: 326 + i * 18, cy: 354, r: 5, fill: c, opacity: 0.85 }, term); });
      txt("tt", 400, 354, "~/plm-web", "mono", C.dim, 17, term);
      txt("cmd", 330, 430, "", "mono", C.text, 25, term);
      txt("resp", 330, 490, "-> main  a1f3 fix login", "mono", C.green, 21, term);
      var gl = grp("gl", g1);
      el("rect", { x: 1100, y: 340, width: 360, height: 220, rx: 18, fill: C.card, stroke: C.edge, "stroke-width": 2, filter: "url(#sh)" }, gl);
      icon(gl, "branch", 1130, 372, 1.6, C.text, 1.8);
      txt("glT", 1190, 392, "gitlab.flexium", "mono", C.dim, 19, gl);
      [0.85, 0.6, 0.72].forEach(function (f, i) { el("rect", { x: 1130, y: 450 + i * 30, width: 300 * f, height: 12, rx: 6, fill: C.track }, gl); });
      var bgl = badge("bgl", 1430, 360, "branch", C.blue, g1);
      line("pushL", "M870 450 H1090", "ln", g1);
      pill("chip", 0, 0, 120, "a1f3", "#1b2231", C.blue, 20, g1);

      /* ---- gp : S2..S11 pipeline ---- */
      var XS = [250, 610, 970, 1330], CY = 470, CW = 300, CH = 330;
      var STAGES = [
        { id: "lint", name: "lint", ic: "list", rows: ["eslint", "prettier", "ruff"] },
        { id: "test", name: "test", ic: "flask", rows: ["test_login", "test_bom", "test_eco", "test_auth", "test_export"] },
        { id: "build", name: "build", ic: "box", rows: ["install", "compile", "image"] },
        { id: "dep", name: "staging", ic: "rocket", rows: ["health", "smoke", "latency"] }
      ];
      STAGES.forEach(function (s, k) {

        el("rect", { class: "face", x: x, y: y, width: CW, height: CH, rx: 20, fill: C.card, stroke: C.edge, "stroke-width": 3, filter: "url(#sh)" }, g);
        el("rect", { x: x + 20, y: y + 18, width: 48, height: 48, rx: 12, fill: "#25252a" }, g);

        s.rows.forEach(function (r, i) {

          var f = el("rect", { id: s.id + "F" + i, x: x + 24, y: ry + 16, width: CW - 48, height: 12, rx: 6, fill: C.blue }, g);
          gsap.set(f, { scaleX: 0, transformOrigin: "0% 50%" });

        var b = badge("b" + s.id, x + CW - 36, y + 42, "x", C.grey, g); /* grey idle ring */
        gsap.set("#b" + s.id + " .base", { opacity: 0 });

        overlay(b, x + CW - 36, y + 42, "x", C.red, "bad");

      });
      /* staging / production title swap on the deploy card */
      txt("depN2", XS[3] - CW / 2 + 82, CY - CH / 2 + 42, "production", "ptl", C.text, 24, document.getElementById("dep"));
      gsap.set("#depN2", { opacity: 0 });

      [0, 1, 2].forEach(function (k) {
        var d = "M" + (XS[k] + CW / 2) + " " + CY + " H" + (XS[k + 1] - CW / 2);
        line("ln" + k, d, "ln", gp); line("gn" + k, d, "gl", gp);
      });
      /* pods inside the deploy card */
      var pods = grp("pods", gp);
      [0, 1, 2, 3].forEach(function (i) {
        var px = 1234 + i * 64;
        el("rect", { id: "pod" + i, x: px - 25, y: 445, width: 50, height: 50, rx: 12, fill: C.orange }, pods);
        txt("pv" + i, px, 520, "v1", "mono", C.dim, 17, pods, "middle");
        txt("pw" + i, px, 520, "v2", "mono", C.green, 17, pods, "middle"); gsap.set("#pw" + i, { opacity: 0 });
      });
      gsap.set(pods, { opacity: 0 });
      /* status bar */
      var sb = grp("sb", gp);
      el("rect", { x: 420, y: 765, width: 760, height: 76, rx: 20, fill: C.card, stroke: C.edge, "stroke-width": 2 }, sb);
      el("circle", { id: "sdot", cx: 460, cy: 803, r: 10, fill: C.blue }, sb);
      var ST = [["st1", "pipeline #482  running", C.text], ["st2", "pipeline #482  failed at test", C.red], ["st3", "pipeline #483  running", C.text],
                ["st4", "staging ok  waiting for approval", C.yellow], ["st5", "production  rolling out", C.text], ["st6", "production  v2 live", C.green], ["st7", "rolled back  v1 live", C.amber]];
      ST.forEach(function (s) { txt(s[0], 490, 803, s[1], "mono", s[2], 22, sb); gsap.set("#" + s[0], { opacity: 0 }); });
      gsap.set(sb, { opacity: 0 });
      var ctrP = counter("ctrP", 80, 90, "pipeline #", gp);
      ctrP.v.textContent = "481";
      pill("halt", XS[1], 700, 150, "HALTED", "#2a1417", C.red, 20, gp);
      pill("tick3", XS[1], 700, 190, "fixed b7c2", "#12251a", C.green, 20, gp);
      var cT = counter("cT", XS[1] - 126, 662, "passed", gp);
      txt("cTs", XS[1] - 126 + 24 + 6 * 13.2 + 26, 662, "/ 5", "mono", C.dim, 22, gp);
      var term2 = grp("term2", gp); el("rect", { x: 330, y: 190, width: 330, height: 50, rx: 14, fill: C.card, stroke: C.edge, "stroke-width": 2 }, term2);
      txt("cmd2", 350, 215, "", "mono", C.text, 21, term2);
      pill("appr", XS[3], 700, 200, "APPROVE", "#2a2410", C.yellow, 22, gp);
      var cur = grp("cur", gp);
      el("path", { d: "M0 0 L0 26 L7 20 L12 31 L17 29 L12 18 L21 18 Z", fill: C.text, stroke: "#0e0e10", "stroke-width": 2 }, cur);
      var ro = icon(gp, "undo", XS[3] - 18, 190, 1.5, C.amber, 2.2, "undoI"); ro.setAttribute("id","undoI");
      pill("rb", XS[3], 700, 200, "ROLLBACK", "#2a1d0a", C.amber, 22, gp);
      var wi = icon(gp, "warn", XS[3] + CW / 2 - 40, CY - CH / 2 - 56, 1.6, C.red, 2, "warnI"); wi.setAttribute("id","warnI");
      var cPods = counter("cPods", XS[3] - 100, 662, "v2 pods", gp);

      /* ---- g12 : S12 headline ---- */
      el("rect", { id: "hl", x: 400, y: 440, width: 800, height: 130, rx: 10, fill: C.yellow }, g12);
      txt("h1", 800, 340, "FROM PUSH", "pt", C.text, 112, g12);
      txt("h2", 800, 507, "TO PROD", "pt", "#0e0e10", 112, g12);
      pill("cicd", 800, 660, 190, "CI / CD", "#19191c", C.dim, 22, g12);

      /* ---------- initial state ---------- */
      ["#m1", "#term", "#resp", "#gl", "#bgl", "#chip", "#sb", "#halt", "#tick3", "#cT", "#cTs", "#term2", "#appr", "#cur", "#undoI", "#rb", "#warnI", "#cPods",
       "#lint", "#test", "#build", "#dep", "#h1", "#h2", "#cicd", "#hl", "#ctrP"].forEach(function (s) { gsap.set(s, { opacity: 0 }); });
      ["#pushL", "#ln0", "#ln1", "#ln2", "#gn0", "#gn1", "#gn2"].forEach(prep);
      gsap.set("#hl", { scaleX: 0, transformOrigin: "0% 50%" });
      ["#chip", "#cur"].forEach(function (q) { document.querySelector(q).setAttribute("transform", "translate(800 450)"); });
      var T = function (i) { return SC[i - 1]; };
      var BAD = "#2a1417";

      /* ============ S1 : git push ============ */
      var t = T(1); V.show("#g1", t);
      V.pop("#m1", t + 0.02); V.pop("#term", t + 0.1);
      V.type("#cmd", "$ git push origin main", t + 0.25, 0.04);
      V.fade("#resp", t + 1.2);
      V.pop("#gl", t + 0.7); V.draw("#pushL", t + 1.15, 0.3);
      tl.set("#chip", { opacity: 1 }, t + 1.3); sfx("pop", t + 1.3); V.along("#chip", "#pushL", t + 1.35, 0.55);
      V.pop("#bgl", t + 1.9);
      /* ============ S2 : pipeline opens ============ */
      t = T(2); V.hide("#g1", t); V.show("#gp", t); V.show("#ctrP", t + 0.05);
      ["lint", "test", "build", "dep"].forEach(function (id, i) { V.pop("#" + id, t + 0.1 + i * 0.18); });
      V.draw("#ln0", t + 0.9, 0.25); V.draw("#ln1", t + 1.0, 0.25); V.draw("#ln2", t + 1.1, 0.25);
      V.count(ctrP, 481, 482, t + 1.2, 0.2);
      V.pop("#sb", t + 1.5); tl.set("#st1", { opacity: 1 }, t + 1.55);
      /* ============ S3 : lint ============ */
      t = T(3);
      V.stroke("#lint .face", C.blue, t + 0.1);
      var lr = ["#lintF0", "#lintF1", "#lintF2"];
      lr.forEach(function (r, i) { V.bar(r, t + 0.3 + i * 0.55, 0.5, 1, C.blue, C.green); });
      tl.to("#blint", { opacity: 1, duration: 0.2 }, t + 2.0); V.flip("blint", "ok", C.green, t + 2.0, "ding");
      V.stroke("#lint .face", C.edge, t + 2.0);
      V.draw("#gn0", t + 2.1, 0.35);
