<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Mono"; src: url("assets/fonts/DejaVuSansMono.ttf"); font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e0e10; }
      #root { position: relative; width: 100%; height: 100%; background: #0e0e10; }
      #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ln { fill: none; stroke: #34343a; stroke-width: 3; }
      .mono { font-family: "Mono", monospace; dominant-baseline: central; }
      .pt { font-family: "Poppins", sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .ico { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <svg id="scene" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.45" />
          </filter>
        </defs>
        <g id="world"></g>
      </svg>
      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="__TOTAL__" data-track-index="1" data-volume="1"></audio>
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="__TOTAL__" data-track-index="2" data-volume="0.22"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="__TOTAL__" data-track-index="3" data-volume="0.75"></audio>
    </div>

    <script>
      var TOTAL = __TOTAL__;
      var SC = __SC__;                 /* scene start times (seconds), from voice lengths */
      var NS = "http://www.w3.org/2000/svg";
      var C = { bg: "#0e0e10", card: "#19191c", edge: "#2c2c31", text: "#e8e6e3", dim: "#9a9aa3",
                orange: "#e0775b", green: "#4ade80", red: "#f4606c", blue: "#5b9cf5", purple: "#a78bfa", yellow: "#f5d94a" };
      var tl = gsap.timeline({ paused: true });
      window.SFX = [];                 /* every helper logs a sound event here; the audio is built from it */
      function sfx(k, t, d) { window.SFX.push({ k: k, t: t, d: d || 0 }); }

      /* ---------- Lucide-style SVG icons (24 grid) ---------- */
      var IC = {
        lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        key: '<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>'
      };
      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        (parent || document.getElementById("world")).appendChild(e);
        return e;
      }
      function grp(id, parent) { return el("g", { id: id }, parent); }

      /* ---------- components ---------- */
      /* window card: dots, mono title, grey placeholder bars */
      function card(id, cx, cy, w, h, title, parent) {
        var g = grp(id, parent), x = cx - w / 2, y = cy - h / 2;
        el("rect", { x: x, y: y, width: w, height: h, rx: 18, fill: C.card, stroke: C.edge, "stroke-width": 2, filter: "url(#sh)" }, g);
        [C.red, C.yellow, C.green].forEach(function (c, i) { el("circle", { cx: x + 24 + i * 18, cy: y + 24, r: 5, fill: c, opacity: 0.85 }, g); });
        var t = el("text", { class: "mono", x: x + 100, y: y + 24, fill: C.dim, "font-size": 17 }, g); t.textContent = title;
        [0.8, 0.55, 0.7].forEach(function (f, i) { el("rect", { x: x + 28, y: y + 62 + i * 26, width: (w - 56) * f, height: 11, rx: 5.5, fill: "#2a2a30" }, g); });
        return g;
      }
      /* status badge: ring + icon; color is animated with gsap (stroke) */
      function badge(id, cx, cy, icon, color, parent) {
        var g = grp(id, parent);
        var ring = el("circle", { class: "ring", cx: cx, cy: cy, r: 24, fill: C.card, "stroke-width": 3.5 }, g);
        var i = el("g", { class: "ico", transform: "translate(" + (cx - 13) + " " + (cy - 13) + ") scale(1.08)", "stroke-width": 2.2 }, g);
        i.innerHTML = IC[icon];
        gsap.set(ring, { stroke: color }); gsap.set(i, { stroke: color });
        return g;
      }
      /* extra icon layer inside a badge (for icon swap lock -> check) */
      function badgeIcon(g, cx, cy, icon, color, cls) {
        var i = el("g", { class: "ico " + cls, transform: "translate(" + (cx - 13) + " " + (cy - 13) + ") scale(1.08)", "stroke-width": 2.4 }, g);
        i.innerHTML = IC[icon]; gsap.set(i, { stroke: color, opacity: 0 });
        return i;
      }
      /* original pixel-art mascot inside an orbit ring */
      function mascot(id, cx, cy, parent) {
        var g = grp(id, parent);
        el("circle", { cx: cx, cy: cy, r: 62, fill: "none", stroke: C.edge, "stroke-width": 2.5 }, g);
        var orb = el("g", { class: "orb" }, g); el("circle", { cx: cx + 62, cy: cy, r: 6, fill: C.orange }, orb);
        var m = el("g", { transform: "translate(" + (cx - 27) + " " + (cy - 24) + ")" }, g), s = 5;
        function px(x, y, w, h, f) { el("rect", { x: x * s, y: y * s, width: w * s, height: h * s, fill: f }, m); }
        px(2, 0, 1, 1, C.orange); px(8, 0, 1, 1, C.orange);          /* antennae */
        px(0, 1, 11, 7, C.orange);                                      /* head */
        px(3, 3, 1, 2, "#1a1210"); px(7, 3, 1, 2, "#1a1210");           /* eyes */
        px(4, 6, 3, 1, "#1a1210");                                      /* mouth */
        px(2, 8, 2, 1, C.orange); px(7, 8, 2, 1, C.orange);            /* feet */
        tl.to(orb, { rotation: 360 * (TOTAL / 3.2), svgOrigin: cx + " " + cy, ease: "none", duration: TOTAL }, 0); /* continuous, deterministic */
        return g;
      }
      function pill(id, cx, cy, w, text, fill, color, size, parent) {
        var g = grp(id, parent);
        el("rect", { x: cx - w / 2, y: cy - 22, width: w, height: 44, rx: 22, fill: fill, stroke: color, "stroke-width": 2 }, g);
        var t = el("text", { class: "mono", x: cx, y: cy + 1, fill: color, "font-size": size || 19, "text-anchor": "middle" }, g); t.textContent = text;
        return g;
      }
      function counter(id, x, y, label, parent) {
        var g = grp(id, parent);
        var l = el("text", { class: "mono", x: x, y: y, fill: C.dim, "font-size": 22 }, g); l.textContent = label;
        var v = el("text", { class: "mono", x: x + 24 + label.length * 13.2, y: y, fill: C.text, "font-size": 30, "font-weight": "bold" }, g); v.textContent = "0";
        return { g: g, v: v };
      }

      /* ---------- motion vocabulary (each helper also logs its sound) ---------- */
      var V = {
        pop: function (s, at, quiet) { tl.fromTo(s, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, at); if (!quiet) sfx("pop", at); },
        fade: function (s, at) { tl.fromTo(s, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at); sfx("pop", at); },
        draw: function (s, at, dur) { tl.to(s, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at); sfx("draw", at, dur); },
        color: function (s, to, at, kind) { tl.to(s, { stroke: to, duration: 0.25, ease: "power1.inOut" }, at); if (kind) sfx(kind, at); },
        fill: function (s, to, at) { tl.to(s, { fill: to, duration: 0.25 }, at); },
        show: function (s, at) { tl.set(s, { opacity: 1 }, at); },
        hide: function (s, at) { tl.set(s, { opacity: 0 }, at); },
        shake: function (s, at) { tl.to(s, { x: 7, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at); tl.set(s, { x: 0 }, at + 0.32); sfx("warn", at); },
        along: function (s, pathSel, at, dur, rev) {
          var p = document.querySelector(pathSel), L = p.getTotalLength(), e = document.querySelector(s), o = { u: 0 };
          tl.to(o, { u: 1, duration: dur, ease: "power2.inOut", onUpdate: function () {
            var pt = p.getPointAtLength((rev ? 1 - o.u : o.u) * L);
            e.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ")");
          } }, at);
          sfx("travel", at, dur);
        },
        type: function (sel, text, at, per) {
          var e = document.querySelector(sel), o = { n: 0 };
          tl.to(o, { n: text.length, duration: text.length * per, ease: "none", onUpdate: function () { e.textContent = text.slice(0, Math.round(o.n)); } }, at);
          for (var i = 0; i < text.length; i++) sfx("key", at + i * per);
        },
        count: function (c, from, to, at, dur) {
          var o = { n: from }, n = Math.abs(to - from);
          tl.to(o, { n: to, duration: dur, ease: "none", onUpdate: function () { c.v.textContent = Math.round(o.n); } }, at);
          for (var i = 1; i <= n; i++) sfx("tick", at + dur * i / n);
        }
      };
      function prep(sel) { var e = document.querySelector(sel), L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + " " + (L + 40), strokeDashoffset: L + 8 }); }
      function line(id, d, parent) { return el("path", { id: id, class: "ln", d: d }, parent); }

      /* =========================================================
         Scene groups (hard cuts between them)
         g1  S1-S2  three apps, locks, identity key
         gm  S3-S10 user -> PLM -> identity / API
         g11 S11    second and third system
         g12 S12    headline
         ========================================================= */
      var g1 = grp("g1"), gm = grp("gm"), g11 = grp("g11"), g12 = grp("g12");
      [g1, gm, g11, g12].forEach(function (g) { gsap.set(g, { opacity: 0 }); });

      /* ---- g1 : S1 / S2 ---- */
      var xs = [400, 800, 1200];
      var names = ["plm.app", "apc.app", "gpm.app"];
      xs.forEach(function (x, i) { card("c" + i, x, 520, 300, 200, names[i], g1); });
      xs.forEach(function (x, i) {
        var b = badge("b" + i, x + 150, 420, "lock", C.red, g1);
        badgeIcon(b, x + 150, 420, "check", C.green, "chk");
      });
      var k0 = card("k0", 800, 190, 300, 150, "identity", g1);
      var kb = badge("kb", 800, 190 + 28, "key", C.green, g1);
      xs.forEach(function (x, i) { line("kl" + i, "M800 266 C 800 330 " + x + " 340 " + x + " 420", g1); });
      var ctr1 = counter("ctr1", 80, 90, "logins", g1);

      /* ---- gm : S3 - S10 ---- */
      mascot("mm", 230, 450, gm);
      card("plm", 760, 450, 300, 220, "plm.app", gm);
      card("idp", 1330, 250, 300, 200, "identity", gm);
      card("api", 1330, 650, 300, 200, "api.server", gm);
      line("l1", "M292 450 H610", gm);
      line("l2", "M910 420 C 1050 420 1050 250 1180 250", gm);
      line("l3", "M910 480 C 1050 480 1050 650 1180 650", gm);
      var bp = badge("bplm", 910, 360, "lock", C.red, gm); badgeIcon(bp, 910, 360, "check", C.green, "chk");
      var bi = badge("bidp", 1480, 168, "lock", C.red, gm); badgeIcon(bi, 1480, 168, "check", C.green, "chk");
      var ba = badge("bapi", 1480, 568, "shield", C.red, gm);
      var ctr2 = counter("ctr2", 80, 90, "step", gm);
      /* login form inside identity */
      el("rect", { x: 1200, y: 262, width: 260, height: 30, rx: 8, fill: "#25252a" }, gm);
      el("rect", { x: 1200, y: 304, width: 260, height: 30, rx: 8, fill: "#25252a" }, gm);
      el("text", { id: "uTxt", class: "mono", x: 1212, y: 278, fill: C.text, "font-size": 18 }, gm);
      el("text", { id: "pTxt", class: "mono", x: 1212, y: 320, fill: C.text, "font-size": 18 }, gm);
      /* redirect pill, code chip, jwt chip, request chips */
      pill("redir", 1060, 345, 190, "302 REDIRECT", "#2a1d19", C.orange, 18, gm);
      var code = grp("code", gm); pill("codeP", 0, 0, 170, "code=a1f3", "#2a1d19", C.orange, 18, code);
      var jwt = grp("jwt", gm);
      [["eyJhb", C.red], ["eyJzdWI", C.purple], ["SflKxw", C.blue]].forEach(function (s, i) {
        var w = [74, 98, 92][i], x0 = [-132, -58, 40][i];
        el("rect", { x: x0 + 2, y: -20, width: w, height: 40, rx: 10, fill: C.card, stroke: s[1], "stroke-width": 2 }, jwt);
        var t = el("text", { class: "mono", x: x0 + 2 + w / 2, y: 1, fill: s[1], "font-size": 17, "text-anchor": "middle" }, jwt); t.textContent = s[0];
      });
      pill("rs", 1330, 378, 150, "RS256", "#1b2231", C.blue, 18, gm);
      pill("pk", 1330, 790, 190, "PUBLIC KEY", "#1b2231", C.blue, 18, gm);
      pill("ok200", 1330, 790, 150, "200 OK", "#12251a", C.green, 20, gm);
      for (var r = 0; r < 3; r++) { var rq = grp("rq" + r, gm); pill("rqP" + r, 0, 0, 140, "GET /api", "#1b2231", C.blue, 17, rq); }
      var ctr3 = counter("ctr3", 80, 150, "reqs", gm);
      /* a small token marker near PLM after login */
      var tokMark = grp("tokMark", gm);
      el("rect", { x: 650, y: 520, width: 220, height: 36, rx: 10, fill: C.card, stroke: C.blue, "stroke-width": 2 }, tokMark);
      var tmT = el("text", { class: "mono", x: 760, y: 539, fill: C.blue, "font-size": 16, "text-anchor": "middle" }, tokMark); tmT.textContent = "Bearer eyJhb…";

      /* ---- g11 : S11 ---- */
      mascot("m2", 200, 450, g11);
      card("idp2", 700, 450, 300, 200, "identity", g11);
      var b2 = badge("b2k", 850, 368, "key", C.green, g11);
      card("apc", 1250, 280, 300, 180, "apc.app", g11);
      card("gpm", 1250, 620, 300, 180, "gpm.app", g11);
      line("q0", "M262 450 H550", g11);
      line("q1", "M850 430 C 1000 430 1000 280 1100 280", g11);
      line("q2", "M850 470 C 1000 470 1000 620 1100 620", g11);
      var bA = badge("bA", 1400, 208, "lock", C.red, g11); badgeIcon(bA, 1400, 208, "check", C.green, "chk");
      var bG = badge("bG", 1400, 548, "lock", C.red, g11); badgeIcon(bG, 1400, 548, "check", C.green, "chk");
      var ctr4 = counter("ctr4", 80, 90, "logins", g11);
      var tA = el("circle", { id: "tA", r: 9, fill: C.blue, cx: 0, cy: 0 }, g11);
      var tG = el("circle", { id: "tG", r: 9, fill: C.blue, cx: 0, cy: 0 }, g11);
      var tA2 = el("circle", { id: "tA2", r: 9, fill: C.blue, cx: 0, cy: 0 }, g11);
      var tG2 = el("circle", { id: "tG2", r: 9, fill: C.blue, cx: 0, cy: 0 }, g11);

      /* ---- g12 : S12 ---- */
      el("rect", { id: "hl", x: 330, y: 430, width: 940, height: 130, rx: 10, fill: C.yellow }, g12);
      var h1 = el("text", { id: "h1", class: "pt", x: 800, y: 340, fill: C.text, "font-size": 118 }, g12); h1.textContent = "ONE LOGIN";
      var h2 = el("text", { id: "h2", class: "pt", x: 800, y: 497, fill: "#0e0e10", "font-size": 118 }, g12); h2.textContent = "ALL SYSTEMS";
      pill("ssoP", 800, 650, 150, "SSO", C.card, C.dim, 22, g12);

      /* ---------- initial state ---------- */
      ["#b0", "#b1", "#b2", "#kb", "#k0", "#c0", "#c1", "#c2", "#bplm", "#bidp", "#bapi", "#bA", "#bG", "#b2k"].forEach(function (s) { gsap.set(s, { opacity: 0 }); });
      ["#mm", "#plm", "#idp", "#api", "#redir", "#code", "#jwt", "#rs", "#pk", "#ok200", "#rq0", "#rq1", "#rq2", "#ctr3", "#tokMark", "#uTxt", "#pTxt",
       "#m2", "#idp2", "#apc", "#gpm", "#tA", "#tG", "#tA2", "#tG2", "#hl", "#h1", "#h2", "#ssoP"].forEach(function (s) { gsap.set(s, { opacity: 0 }); });
      gsap.set("#gm rect[x='1200']", { opacity: 0 });
      ["#kl0", "#kl1", "#kl2", "#l1", "#l2", "#l3", "#q0", "#q1", "#q2"].forEach(prep);
      gsap.set("#hl", { scaleX: 0, transformOrigin: "0% 50%" });
      ["#code", "#jwt", "#rq0", "#rq1", "#rq2", "#tA", "#tG", "#tA2", "#tG2"].forEach(function (q) { document.querySelector(q).setAttribute("transform", "translate(800 450)"); });
      /* every red/green badge: the lock is the base icon, the check is the overlay icon */
      var T = function (i) { return SC[i - 1]; };            /* scene i start */

      /* ================= S1 (T1) : every system asks for a login ================= */
      var t = T(1); V.show("#g1", t);
      xs.forEach(function (x, i) { V.pop("#c" + i, t + 0.1 + i * 0.15); });
      xs.forEach(function (x, i) { V.pop("#b" + i, t + 0.9 + i * 0.7); });
      V.count(ctr1, 0, 3, t + 0.9, 1.4);
      tl.to(ctr1.v, { fill: C.red, duration: 0.2 }, t + 2.7); V.shake("#ctr1", t + 2.7);
      /* ================= S2 : one login, all pass ================= */
      t = T(2);
      V.pop("#k0", t + 0.1); V.pop("#kb", t + 0.3);
      V.draw("#kl0", t + 0.55, 0.5); V.draw("#kl1", t + 0.55, 0.5); V.draw("#kl2", t + 0.55, 0.5);
      xs.forEach(function (x, i) {
        var at = t + 1.35 + i * 0.12;
        V.color("#b" + i + " .ring", C.green, at, i === 0 ? "ding" : null);
        V.color("#b" + i + " .ico:not(.chk)", C.green, at);
        tl.to("#b" + i + " .ico:not(.chk)", { opacity: 0, duration: 0.15 }, at + 0.1);
        tl.to("#b" + i + " .chk", { opacity: 1, duration: 0.15 }, at + 0.1);
      });
      V.count(ctr1, 3, 1, t + 1.35, 0.5); tl.to(ctr1.v, { fill: C.green, duration: 0.2 }, t + 1.9);
      V.hide("#g1", T(3));

      /* ================= S3 : open PLM ================= */
      t = T(3); V.show("#gm", t);
      V.pop("#mm", t + 0.05); V.draw("#l1", t + 0.3, 0.45); V.pop("#plm", t + 0.65);
      V.count(ctr2, 0, 1, t + 0.7, 0.2);
      /* ================= S4 : not logged in -> redirect ================= */
      t = T(4);
      V.pop("#bplm", t + 0.1); V.shake("#bplm", t + 0.12);
      V.draw("#l2", t + 0.5, 0.55); V.pop("#idp", t + 0.55);
      V.fade("#redir", t + 0.95);
      /* redirect dot */
      var rd = el("circle", { id: "rd", r: 10, fill: C.orange, cx: 0, cy: 0 }, gm); gsap.set(rd, { opacity: 0 }); rd.setAttribute("transform", "translate(800 450)");
      tl.set("#rd", { opacity: 1 }, t + 1.0); V.along("#rd", "#l2", t + 1.0, 0.8); tl.set("#rd", { opacity: 0 }, t + 1.85);
      V.count(ctr2, 1, 2, t + 1.0, 0.2);
      /* ================= S5 : credentials -> verified ================= */
      t = T(5);
      tl.set("#redir", { opacity: 0 }, t);
      tl.set("#gm rect[x='1200']", { opacity: 1 }, t + 0.05);
      V.pop("#bidp", t + 0.1);
      tl.set("#uTxt", { opacity: 1 }, t + 0.2); V.type("#uTxt", "alice", t + 0.25, 0.09);
      tl.set("#pTxt", { opacity: 1 }, t + 0.8); V.type("#pTxt", "••••••", t + 0.85, 0.07);
      var at5 = t + 1.7;
      V.color("#bidp .ring", C.green, at5, "ding"); V.color("#bidp .ico:not(.chk)", C.green, at5);
      tl.to("#bidp .ico:not(.chk)", { opacity: 0, duration: 0.15 }, at5 + 0.1); tl.to("#bidp .chk", { opacity: 1, duration: 0.15 }, at5 + 0.1);
      V.count(ctr2, 2, 3, t + 1.7, 0.2);
      /* ================= S6 : authorization code ================= */
      t = T(6);
      tl.set("#gm rect[x='1200']", { opacity: 0 }, t); tl.set("#uTxt", { opacity: 0 }, t); tl.set("#pTxt", { opacity: 0 }, t);
      tl.set("#code", { opacity: 1 }, t + 0.35); sfx("pop", t + 0.35);
      V.along("#code", "#l2", t + 0.4, 0.95, true);
      V.count(ctr2, 3, 4, t + 0.4, 0.2);
      /* ================= S7 : swap code for a JWT ================= */
      t = T(7);
      V.along("#code", "#l2", t + 0.1, 0.7, false);
      tl.to("#code", { opacity: 0, duration: 0.2 }, t + 0.85);
      tl.set("#jwt", { opacity: 1 }, t + 0.95); sfx("pop", t + 0.95);
      V.along("#jwt", "#l2", t + 1.1, 1.0, true);
      V.count(ctr2, 4, 5, t + 1.1, 0.2);
      /* ================= S8 : signed with the private key ================= */
      t = T(8);
      V.pop("#rs", t + 0.1);
      /* jwt docks near PLM */
      tl.set("#tokMark", { opacity: 1 }, t + 1.1); sfx("pop", t + 1.1);
      tl.to("#jwt", { opacity: 0, duration: 0.2 }, t + 1.05);
      var at8 = t + 1.5;
      V.color("#bplm .ring", C.green, at8, "ding"); V.color("#bplm .ico:not(.chk)", C.green, at8);
      tl.to("#bplm .ico:not(.chk)", { opacity: 0, duration: 0.15 }, at8 + 0.1); tl.to("#bplm .chk", { opacity: 1, duration: 0.15 }, at8 + 0.1);
      V.count(ctr2, 5, 6, t + 1.5, 0.2);
      /* ================= S9 : every request carries the token ================= */
      t = T(9);
      tl.set("#rs", { opacity: 0 }, t);
      V.pop("#api", t + 0.1); V.draw("#l3", t + 0.2, 0.45); V.pop("#bapi", t + 0.45); tl.set("#ctr3", { opacity: 1 }, t + 0.5);
      for (var q = 0; q < 3; q++) {
        tl.set("#rq" + q, { opacity: 1 }, t + 0.7 + q * 0.28);
        V.along("#rq" + q, "#l3", t + 0.7 + q * 0.28, 0.65, false);
        tl.set("#rq" + q, { opacity: 0 }, t + 1.38 + q * 0.28);
      }
      V.count(ctr3, 0, 3, t + 1.3, 0.85);
      /* ================= S10 : verified with the public key ================= */
      t = T(10);
      V.fade("#pk", t + 0.2);
      var at10 = t + 1.2;
      V.color("#bapi .ring", C.green, at10, "ding"); V.color("#bapi .ico", C.green, at10);
      tl.to("#pk", { opacity: 0, duration: 0.15 }, at10); V.pop("#ok200", at10 + 0.1);
      tl.to("#api rect:first-child", { stroke: C.green, duration: 0.3 }, at10);
      V.hide("#gm", T(11));

      /* ================= S11 : the other systems are already trusted ================= */
      t = T(11); V.show("#g11", t);
      V.pop("#m2", t + 0.05); V.draw("#q0", t + 0.25, 0.35); V.pop("#idp2", t + 0.2); V.pop("#b2k", t + 0.5);
      V.pop("#apc", t + 0.7); V.pop("#gpm", t + 0.9);
      V.draw("#q1", t + 1.1, 0.4); V.draw("#q2", t + 1.1, 0.4);
      V.pop("#bA", t + 1.3); V.pop("#bG", t + 1.4);
      var pts = [["#tA", "#q1"], ["#tG", "#q2"]];
      pts.forEach(function (p) { tl.set(p[0], { opacity: 1 }, t + 1.55); V.along(p[0], p[1], t + 1.55, 0.7); tl.set(p[0], { opacity: 0 }, t + 2.3); });
      [["#bA", 0], ["#bG", 1]].forEach(function (b) {
        var a = t + 2.35 + b[1] * 0.15;
        V.color(b[0] + " .ring", C.green, a, "ding"); V.color(b[0] + " .ico:not(.chk)", C.green, a);
        tl.to(b[0] + " .ico:not(.chk)", { opacity: 0, duration: 0.15 }, a + 0.1); tl.to(b[0] + " .chk", { opacity: 1, duration: 0.15 }, a + 0.1);
      });
      V.count(ctr4, 0, 1, t + 0.3, 0.2);
      tl.to(ctr4.v, { fill: C.green, duration: 0.2 }, t + 0.55);
      V.hide("#g11", T(12));

      /* ================= S12 : headline ================= */
      t = T(12); V.show("#g12", t);
      V.pop("#h1", t + 0.05);
      tl.set("#hl", { opacity: 1 }, t + 0.2); tl.to("#hl", { scaleX: 1, duration: 0.35, ease: "power3.out" }, t + 0.2); sfx("draw", t + 0.2, 0.35);
      V.pop("#h2", t + 0.35); V.pop("#ssoP", t + 0.7, true);
      sfx("chime", t + 0.7);

      tl.set({}, {}, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
