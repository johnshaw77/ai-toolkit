  </head>

                orange: "#e0775b", green: "#4ade80", red: "#f4606c", blue: "#5b9cf5", yellow: "#f5d94a", amber: "#f5a623", grey: "#4a4a52" };

        flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
        box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/>',

      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);

      }
      function grp(id, parent) { return el("g", { id: id }, parent); }
      function txt(id, x, y, s, cls, fill, size, parent, anchor) {

        if (anchor) t.setAttribute("text-anchor", anchor);

      function icon(parent, name, x, y, sc, color, sw, cls) {

      /* round status badge: ring + base icon + overlay icons */

      function overlay(g, cx, cy, name, color, cls) { var i = icon(g, name, cx - 13, cy - 13, 1.08, color, 2.6, cls); gsap.set(i, { opacity: 0 }); return i; }
      function mascot(id, cx, cy, parent) {

        var m = el("g", { transform: "translate(" + (cx - 27) + " " + (cy - 24) + ")" }, g), s = 5;

      }

      function counter(id, x, y, label, parent) {

      /* ---------- motion vocabulary (each helper also logs its sound) ---------- */
      var V = {
        pop: function (s, at, quiet) { tl.fromTo(s, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, at); if (!quiet) sfx("pop", at); },

        stroke: function (s, to, at, kind) { tl.to(s, { stroke: to, duration: 0.25, ease: "power1.inOut" }, at); if (kind) sfx(kind, at); },
        fillc: function (s, to, at) { tl.to(s, { fill: to, duration: 0.25, ease: "power1.inOut" }, at); },
        show: function (s, at) { tl.set(s, { opacity: 1 }, at); },
        hide: function (s, at) { tl.set(s, { opacity: 0 }, at); },
        shake: function (s, at) { tl.to(s, { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at); tl.set(s, { x: 0 }, at + 0.32); sfx("warn", at); },

        bar: function (s, at, dur, to, run, done) {

          tl.to(s, { scaleX: to, duration: dur, ease: "power1.inOut" }, at);
          if (done) tl.to(s, { fill: done, duration: 0.2 }, at + dur);
          sfx("fill", at, dur);
        },
        resetBar: function (s, at) { tl.to(s, { scaleX: 0, duration: 0.2, ease: "power2.in" }, at); },
        /* icon swap inside a badge: base out, overlay in, ring + icon recolor */

          V.stroke("#" + id + " .ring", color, at, kind);
          tl.to("#" + id + " .base", { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " ." + over, { opacity: 1, stroke: color, duration: 0.2 }, at + 0.05);
        },
        unflip: function (id, over, at) {   /* back to the base icon */
          tl.to("#" + id + " ." + over, { opacity: 0, duration: 0.15 }, at);
          tl.to("#" + id + " .base", { opacity: 1, duration: 0.15 }, at + 0.05);

        swapText: function (a, b, at) { tl.to(a, { opacity: 0, duration: 0.15 }, at); tl.to(b, { opacity: 1, duration: 0.2 }, at + 0.05); },
        along: function (s, pathSel, at, dur, rev) {
          var p = document.querySelector(pathSel), L = p.getTotalLength(), e = document.querySelector(s), o = { u: 0 };
          tl.to(o, { u: 1, duration: dur, ease: "power2.inOut", onUpdate: function () {
            var pt = p.getPointAtLength((rev ? 1 - o.u : o.u) * L);

          for (var i = 1; i <= n; i++) sfx("tick", at + dur * i / n);

      function prep(sel) { var e = document.querySelector(sel), L = e.getTotalLength(); gsap.set(e, { strokeDasharray: L + " " + (L + 40), strokeDashoffset: L + 8 }); }
      function line(id, d, cls, parent) { return el("path", { id: id, class: cls || "ln", d: d }, parent); }

        calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',

      var t;
      function setState(a, b, at, color, kind) {
        tl.to("#sn" + a, { opacity: 0, duration: 0.15 }, at); tl.to("#bi" + a, { opacity: 0, duration: 0.15 }, at);
        tl.fromTo("#sn" + b, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at + 0.08);
        tl.to("#bi" + b, { opacity: 1, duration: 0.2 }, at + 0.08);
        tl.to("#gsRing", { stroke: color, duration: 0.25 }, at); tl.to("#gsFace", { stroke: color, duration: 0.25 }, at);
        if (kind) sfx(kind, at);
      }
      function clock(at, from, to, dur, every) {
        var o = { m: from }, e = document.getElementById("tm");
        tl.to(o, { m: to, duration: dur, ease: "none", onUpdate: function () { e.textContent = fmt(o.m); } }, at);
        var n = Math.floor((to - from) / every);
        for (var i = 1; i <= n; i++) sfx("tick", at + dur * (i * every) / (to - from));
      }
      function run(i, from, to, at, dur) {
        tl.to("#sf" + i, { scaleX: 1, duration: dur, ease: "none" }, at);
        tl.to("#ph", { x: to, duration: dur, ease: "none" }, at);
      }

      /* S1 : meeting created */
      t = T(1);
      V.fade("#tlb", t + 0.05); V.pop("#ph", t + 0.35, true); V.pop("#tkg0", t + 0.4, true);
      V.pop("#gs", t + 0.3);
      /* S2 : click link -> waiting */
      t = T(2);
      V.pop("#lk", t + 0.2); tl.set("#cur", { opacity: 1 }, t + 0.3);
      tl.to("#cur", { x: 835, y: 835, duration: 0.7, ease: "power2.inOut" }, t + 0.4);
      tl.to("#lk", { scale: 0.93, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1 }, t + 1.2); sfx("tick", t + 1.2);
      tl.to("#cur", { opacity: 0, duration: 0.2 }, t + 1.55); tl.to("#lk", { opacity: 0, duration: 0.2 }, t + 1.55);
      setState(0, 1, t + 1.35, C.orange, "pop");
      V.pop("#segT0", t + 1.5, true);
      tl.to("#bw1", { rotation: 180, svgOrigin: "560 560", duration: 0.45, ease: "power2.inOut" }, t + 2.3);
      tl.to("#bw1", { rotation: 360, svgOrigin: "560 560", duration: 0.45, ease: "power2.inOut" }, t + 3.2);
      /* S3 : waiting until 11:15 */
      t = T(3);
      clock(t + 0.15, 598, 675, 2.5, 8); run(0, 0, 800, t + 0.15, 2.5);
      tl.to("#bw1", { rotation: 540, svgOrigin: "560 560", duration: 0.45, ease: "power2.inOut" }, t + 1.0);
      tl.to("#bw1", { rotation: 720, svgOrigin: "560 560", duration: 0.45, ease: "power2.inOut" }, t + 2.0);
      V.pop("#tkg1", t + 2.5, true);
      /* S4 : 11:15 early entry */
      t = T(4);
      setState(1, 2, t + 0.1, C.blue, "ding"); V.pop("#segT1", t + 0.15, true);
      clock(t + 0.6, 675, 690, 1.9, 5); run(1, 0, 1130, t + 0.6, 1.9);
      V.pop("#tkg2", t + 2.4, true);
      /* S5 : 11:30 meeting starts */
      t = T(5);
      setState(2, 3, t + 0.1, C.green, "ding"); V.pop("#segT2", t + 0.15, true);
      clock(t + 0.5, 690, 720, 1.9, 10); run(2, 0, 1500, t + 0.5, 1.9);
      V.pop("#tkg3", t + 2.4, true);
      /* S6 : the question */
      t = T(6);
      tl.to("#gs", { opacity: 0, duration: 0.25 }, t + 0.05);
      V.pop("#dm", t + 0.35); V.fade("#cap", t + 0.9);
      V.draw("#dL", t + 2.9, 0.5); V.draw("#dR", t + 2.9, 0.5);
      V.fade("#lbN", t + 3.2); V.fade("#lbY", t + 3.2);
      /* S7 : NO */
      t = T(7);
      tl.to("#lbN", { fill: C.text, duration: 0.2 }, t + 0.05); tl.to("#dR", { opacity: 0.25, duration: 0.25 }, t + 0.05);
      tl.set("#whoA", { opacity: 1 }, t + 0.15); V.along("#whoA", "#dL", t + 0.2, 0.9);
      tl.to("#whoA", { opacity: 0, duration: 0.15 }, t + 1.1);
      V.pop("#ca", t + 1.05); tl.to("#ca .face", { stroke: STEEL, duration: 0.25 }, t + 1.05);
      /* S8 : YES */
      t = T(8);
      tl.to("#dR", { opacity: 1, stroke: C.green, duration: 0.25 }, t + 0.05); tl.to("#dL", { opacity: 0.25, duration: 0.25 }, t + 0.05);
      tl.to("#lbY", { fill: C.green, duration: 0.2 }, t + 0.05);
      tl.set("#whoB", { opacity: 1 }, t + 0.1); V.along("#whoB", "#dR", t + 0.15, 0.8);
      tl.to("#whoB", { opacity: 0, duration: 0.15 }, t + 0.95);
      V.pop("#cb", t + 0.9); tl.to("#cb .face", { stroke: C.green, duration: 0.25 }, t + 0.9); sfx("ding", t + 0.95);
      /* S9 : headline */
      t = T(9);
      V.hide("#gm", t); V.show("#g9", t);
      V.pop("#h1", t + 0.05);
      tl.to("#hl", { scaleX: 1, duration: 0.35, ease: "power3.out" }, t + 0.25); sfx("draw", t + 0.25, 0.35);
      V.pop("#h2", t + 0.4); V.pop("#wbx", t + 0.8, true); sfx("chime", t + 0.8);

      tl.set({}, {}, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
