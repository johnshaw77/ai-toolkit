<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 - {{ app_title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📦</text></svg>">
  <script>
    // 主題要在第一次繪製之前決定，否則會先閃一下亮色。這段刻意內嵌且同步。
    (() => {
      const saved = localStorage.getItem('theme')
      const dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    })()
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">📦 {{ app_title }}</h1>

    {% if error %}
    <p class="alert alert-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="stack">
      <input type="hidden" name="next" value="{{ next }}">

      <label class="field">
        <span class="field-label">電子郵件</span>
        <input type="email" name="email" required autocomplete="username"
               placeholder="admin@example.com" autofocus>
      </label>

      <label class="field">
        <span class="field-label">密碼</span>
        <input type="password" name="password" required autocomplete="current-password"
               placeholder="請輸入密碼">
      </label>

      <button type="submit" class="button button-primary button-block">登入</button>
    </form>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
