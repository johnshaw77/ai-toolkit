[project]
name = "{{name}}"
version = "0.1.0"
description = "{{description}}"
readme = "README.md"
requires-python = ">={{python_version}}"
license = { text = "MIT" }
# 刻意不用 ORM：這類工具的查詢都很直白，ORM 的抽象成本大於好處。
# 資料層用 stdlib 的 sqlite3。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # starlette 1.6 起 TestClient 要的是 httpx2；裝舊的 httpx 會冒 deprecation 警告。
    "httpx2>=0.28",
    "pytest-playwright>=0.6",
    "ruff>=0.9",
]

[project.scripts]
{{name}} = "{{name}}.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{name}}"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008：FastAPI 的 Depends()/Query()/Form() 就是寫在預設值裡，這條對它沒意義。
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e 要開瀏覽器，預設不跑。`make e2e` 會明確把它們挑出來。
markers = ["e2e: 需要真的開瀏覽器的端對端測試"]
addopts = "-m 'not e2e'"
filterwarnings = [
    # 自己的程式碼冒警告就當成錯誤，不要讓它累積成背景雜訊。
    "error",
    # 以下是上游的：starlette 1.6 在 anyio 4.15 底下 import 時自己會噴。
    # 不是我們能修的，等它們對齊之後把這行刪掉。
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
