# 容器版。開發時不一定要用它——`make run` 直接在本機跑比較快，這裡是給
# 「要跟別人一樣的環境」或「要驗證正式建置」時用的。
#
#   docker compose up -d --build   # 起來（第一次會建置映像）
#   docker compose ps              # 確認是 running/healthy
#   docker compose logs -f         # 看 log
#
# 對外的埠跟本機開發用的**刻意錯開**，兩邊可以同時跑。
# 要換埠的話設 HOST_PORT，不要改 .env 的 APP_PORT（那是容器內部的）。
#
# 注意：`docker compose down -v` 會連 volume 一起刪掉，資料就沒了。

name: {{name}}

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-before-deploying-anywhere-0123456789}
      # 第一次起來時建好管理員與範例資料。上線環境請設成 0。
      SEED_ON_START: ${SEED_ON_START:-1}
    volumes:
      - app-data:/data
    ports:
      # 變數刻意叫 HOST_PORT 而不是 APP_PORT：**compose 會讀專案根目錄的 .env**，
      # 而那裡的 APP_PORT 是給應用程式用的（本機開發的埠）。同名的話容器會被
      # 映到本機開發那個埠上，跟 `make run` 直接撞死。
      - "${HOST_PORT:-{{container_port}}}:8000"

volumes:
  app-data:
