[project]
name = "smart-scaffold"
version = "0.1.0"
description = "逐步問答式的專案腳手架工具：問完該問的，直接生出可以動工的骨架"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "john_hsiao" }]
# 執行期零第三方依賴——只用標準庫，才能在任何一台剛裝好的機器上跑。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
smart-scaffold = "smart_scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_scaffold"]

[tool.hatch.build.targets.wheel.force-include]
"src/smart_scaffold/templates" = "smart_scaffold/templates"

[tool.ruff]
line-length = 100
target-version = "py312"
# 模板裡滿是 {{var}} 佔位符，不是合法 Python，不能給 ruff 檢查。
extend-exclude = ["src/smart_scaffold/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
